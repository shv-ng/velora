name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.svu.outputs.version }}
      tag:     ${{ steps.svu.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install svu
        run: |
          curl -sSLO https://github.com/caarlos0/svu/releases/latest/download/svu_linux_amd64.tar.gz
          tar xzf svu_linux_amd64.tar.gz svu
          sudo mv svu /usr/local/bin/svu
          rm svu_linux_amd64.tar.gz

      - name: Compute next tag
        id: svu
        run: |
          NEXT=$(svu next)
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEXT}"       >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.svu.outputs.tag }}"
          git push origin "${{ steps.svu.outputs.tag }}"

  build:
    name: Build (${{ matrix.target }})
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          - os: windows-latest
            target: windows-amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install llvm -y
        shell: pwsh

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          clang ./src/*.c \
            -o dist/velora-${{ matrix.target }}${{ matrix.ext }} \
            -Wall -Wextra \
            -DVERSION=\"${{ needs.tag.outputs.version }}\" \
            -DCOMMIT=\"$(git rev-parse --short HEAD)\" \
            -DDATE=\"$(date +%Y-%m-%d)\"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-${{ matrix.target }}
          path: dist/velora-${{ matrix.target }}${{ matrix.ext }}

  release:
    name: Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name:     ${{ needs.tag.outputs.tag }}
          files:    dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
