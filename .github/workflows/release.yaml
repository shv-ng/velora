name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y llvm-dev clang libzstd-dev libstdc++-14-dev libtinfo-dev

      - name: Build
        run: |
          mkdir -p dist
          clang ./src/*.c ./src/*/*.c -o ./dist/velora-linux-amd64 -Wall -Wextra -g \
            -DVERSION=\"${{ github.ref_name }}\" \
            -DCOMMIT=\"$(git rev-parse --short HEAD)\" \
            -DDATE=\"$(date +%Y-%m-%d)\" \
            $(llvm-config --cflags --ldflags --libs core analysis native --link-static) \
            -lpthread -ldl -ltinfo -static-libgcc -static-libsan \
            -Wl,-Bstatic -lzstd -lz -lstdc++ \
            -Wl,-Bdynamic -lm -lc -lgcc_s

      - uses: actions/upload-artifact@v7
        with:
          name: velora-linux-amd64
          path: dist/velora-linux-amd64

  build-linux-arm64:
    name: Build (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y llvm-dev clang libzstd-dev libstdc++-14-dev libtinfo-dev

      - name: Build
        run: |
          mkdir -p dist
          clang ./src/*.c ./src/*/*.c -o ./dist/velora-linux-arm64 -Wall -Wextra -g \
            -DVERSION=\"${{ github.ref_name }}\" \
            -DCOMMIT=\"$(git rev-parse --short HEAD)\" \
            -DDATE=\"$(date +%Y-%m-%d)\" \
            $(llvm-config --cflags --ldflags --libs core analysis native --link-static) \
            -lpthread -ldl -ltinfo -static-libgcc -static-libsan \
            -Wl,-Bstatic -lzstd -lz -lstdc++ \
            -Wl,-Bdynamic -lm -lc -lgcc_s

      - uses: actions/upload-artifact@v7
        with:
          name: velora-linux-arm64
          path: dist/velora-linux-arm64

  build-darwin-arm64:
    name: Build (darwin-arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install llvm zstd

      - name: Build
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          mkdir -p dist
          clang ./src/*.c ./src/*/*.c -o ./dist/velora-darwin-arm64 -Wall -Wextra -g \
            -DVERSION=\"${{ github.ref_name }}\" \
            -DCOMMIT=\"$(git rev-parse --short HEAD)\" \
            -DDATE=\"$(date +%Y-%m-%d)\" \
            $(llvm-config --cflags --ldflags --libs core analysis native) \
            -lpthread -lzstd -lz -lc++

      - uses: actions/upload-artifact@v7
        with:
          name: velora-darwin-arm64
          path: dist/velora-darwin-arm64

  release:
    name: Release
    needs: [build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name:     ${{ github.ref_name }}
          files:    dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
